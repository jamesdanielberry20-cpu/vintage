# Gradle properties
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Fabric Properties
# check these on https://fabricmc.net/develop before building -
# Loom resolves Yarn/Loader/API automatically for the given Minecraft version,
# but pin exact build numbers here for reproducible builds.
minecraft_version=26.2
yarn_mappings=26.2+build.1
loader_version=0.19.3

# Mod Properties
mod_version=1.0.0
maven_group=com.vantage
archives_base_name=vantage-client

# Dependencies
fabric_version=0.153.0+26.2

# Java toolchain (Minecraft 26.x requires Java 25+)
java_version=25
